<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>i love you kaan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="floating-hearts" aria-hidden="true"></div>

    <main class="container">
        <div class="message">
            <div class="heart-mark" aria-hidden="true">&#9829;</div>
            <h1>seni seviyorum kaan</h1>
            <p>her zaman, her yerde</p>
            <div class="heart-line" aria-hidden="true">&#9829; &#9829; &#9829;</div>
        </div>
    </main>

    <section class="ocean" aria-label="Denizin altında el ele yüzen iki dalgıç">
        <div class="ocean-title">aşkımızın derinliklerinde</div>
        <div class="sun-rays" aria-hidden="true"></div>
        <div class="fish fish-one" aria-hidden="true">&lt;><span></span></div>
        <div class="fish fish-two" aria-hidden="true">&lt;><span></span></div>
        <div class="bubbles bubbles-left" aria-hidden="true">&#9675; &#9675; &#9675;</div>
        <div class="bubbles bubbles-right" aria-hidden="true">&#9675; &#9675;</div>

        <div class="divers" aria-hidden="true">
            <div class="diver diver-girl">
                <div class="tank"></div>
                <div class="head"><div class="hair"></div><div class="mask"></div></div>
                <div class="body-suit"></div>
                <div class="arm arm-holding"><span class="hand"></span></div>
                <div class="arm arm-free"></div>
                <div class="leg leg-back"></div>
                <div class="leg leg-front"></div>
                <div class="fin fin-back"></div>
                <div class="fin fin-front"></div>
            </div>
            <div class="diver diver-boy">
                <div class="tank"></div>
                <div class="head"><div class="hair"></div><div class="mask"></div></div>
                <div class="body-suit"></div>
                <div class="arm arm-holding"><span class="hand"></span></div>
                <div class="arm arm-free"></div>
                <div class="leg leg-back"></div>
                <div class="leg leg-front"></div>
                <div class="fin fin-back"></div>
                <div class="fin fin-front"></div>
            </div>
        </div>

        <div class="coral coral-left" aria-hidden="true"></div>
        <div class="coral coral-right" aria-hidden="true"></div>
        <div class="seafloor" aria-hidden="true"></div>
    </section>

    <script>
        const hearts = document.querySelector('.floating-hearts');
        const heartCount = 22;

        for (let index = 0; index < heartCount; index += 1) {
            const heart = document.createElement('span');
            heart.className = 'floating-heart';
            heart.textContent = '\u2665';
            heart.style.setProperty('--left', `${Math.random() * 100}%`);
            heart.style.setProperty('--size', `${14 + Math.random() * 28}px`);
            heart.style.setProperty('--delay', `${Math.random() * -12}s`);
            heart.style.setProperty('--duration', `${8 + Math.random() * 8}s`);
            heart.style.setProperty('--drift', `${-90 + Math.random() * 180}px`);
            hearts.appendChild(heart);
        }
    </script>

</body>
</html>
